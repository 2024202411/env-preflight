name: CI
on:
  push:
    branches: [main, feat/initial-preflight]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check the passing example
        run: node dist/cli.js --src examples/app --example examples/config/example.env --env examples/config/valid.env --optional PORT --strict
      - name: Check the template without secrets
        run: node dist/cli.js --src examples/app --example examples/config/example.env --example-only --strict
      - run: npm pack --dry-run
